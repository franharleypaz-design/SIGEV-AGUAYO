<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro Documental - SIGEV Aguayo</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/solicitudes.css">
    <link rel="stylesheet" href="css/documentos.css"> 
    <link rel="stylesheet" href="css/mobile.css">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <script type="module">
        import { inyectarEstructuraGlobal } from "./js/layout.js";
        inyectarEstructuraGlobal();
    </script>
    <script type="module" src="js/app.js" defer></script>
    <script type="module" src="js/documentos.js" defer></script>
</head>
<body>

    <div id="app-workspace" class="app-container" style="display: none;">
        
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="topbar-container"></div>

            <div class="dashboard-body">
                <div style="margin-bottom: 20px;">
                    <h2 style="font-size: 20px; font-weight: 700; color: var(--text-dark);">Centro Documental</h2>
                    <p style="font-size: 13px; color: var(--text-light); margin-top: 2px;">Organización territorial por carpetas de expedientes vecinales</p>
                </div>

                <section class="filter-panel-card" id="doc-search-bar-section">
                    <div class="filter-layout-row" style="grid-template-columns: 1fr auto;">
                        <div class="filter-control">
                            <label id="search-bar-label">Buscar Carpeta Vecinal</label>
                            <input type="text" id="filter-doc-busqueda" placeholder="Busca por Nombre, RUT (con/sin puntos ni guion) o ID (#8QRPXK)...">
                        </div>
                        <div class="filter-buttons-group" style="align-self: flex-end;">
                            <button id="btn-clear-doc-search" class="btn btn-secondary">Limpiar Filtro</button>
                        </div>
                    </div>
                </section>

                <section class="doc-panel-content active" id="panel-principal-carpetas">
                    <div class="folder-grid-canvas" id="folders-master-container"></div>
                </section>

            </div>

            <footer class="app-main-footer">
                <span>© 2026 Sistema de Gestión Vecinal – Concejal Gonzalo Aguayo – La Cisterna</span>
                <span>Versión 1.0.0</span>
            </footer>
        </main>
    </div>

    <div id="modal-folder-view" class="profile-modal-overlay" style="display: none; z-index: 2500;">
        <div class="profile-modal-card" style="max-width: 620px; width: 90%;">
            <div class="profile-modal-header" style="background: linear-gradient(135deg, #1e293b, #0b438c); padding: 20px 32px;">
                <div class="profile-header-info">
                    <h3 id="modal-folder-title" style="font-size: 18px; color: #fff; font-weight: 700;">Carpeta de Expediente</h3>
                    <p id="modal-folder-subtitle" style="color: rgba(255,255,255,0.8); font-weight: 500;">RUN: 00.000.000-0</p>
                </div>
                <button id="btn-close-folder-modal" class="btn-profile-close" style="top: 16px; right: 16px; color:#fff; font-size:24px;">&times;</button>
            </div>
            
            <div class="profile-modal-body" style="padding: 24px 32px; background: #f8fafc; max-height: 450px; overflow-y: auto;">
                <div class="modal-accordion-container">
                    
                    <div class="accordion-item">
                        <div class="accordion-header">
                            <span>📸 Registro Fotográfico</span>
                            <span class="accordion-arrow">▼</span>
                        </div>
                        <div class="accordion-content" style="display: none;">
                            <div id="modal-folder-photo-box"></div>
                        </div>
                    </div>

                    <div class="accordion-item" style="margin-top: 14px;">
                        <div class="accordion-header">
                            <span>📄 Fichas y Documentación Digital</span>
                            <span class="accordion-arrow">▼</span>
                        </div>
                        <div class="accordion-content" style="display: none;">
                            <div id="modal-folder-doc-box"></div>
                        </div>
                    </div>

                </div>
            </div>
            
            <div style="padding: 16px 32px; background: #f1f5f9; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 12px; border-bottom-left-radius: 8px; border-bottom-right-radius: 8px;">
                <button type="button" id="btn-modal-folder-redirect" class="btn btn-primary" style="background-color: #0b438c;">Ver Expediente</button>
                <button type="button" id="btn-modal-folder-close-footer" class="btn btn-secondary">Cerrar Carpeta</button>
            </div>
        </div>
    </div>

</body>
</html>

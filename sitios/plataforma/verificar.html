<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Seguridad (2FA) - SIGEV</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .card-2fa { max-width: 450px; width: 100%; border: none; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .code-input { font-size: 24px; text-align: center; letter-spacing: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="card card-2fa p-4 bg-white">
    <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">Validación de Identidad</h3>
        <p class="text-muted small">Por tu seguridad, hemos enviado un código de acceso dinámico de 6 dígitos a tu bandeja de entrada.</p>
    </div>

    <div id="mensaje-status" class="alert d-none small text-center py-2 mb-3" role="alert"></div>

    <form id="form-2fa">
        <div class="mb-4">
            <label class="form-label text-secondary small fw-bold">CÓDIGO DE VERIFICACIÓN</label>
            <input type="text" id="input-codigo" class="form-control code-input" placeholder="000000" maxlength="6" required autocomplete="off">
        </div>

        <button type="submit" id="btn-verificar" class="btn btn-primary w-100 fw-bold py-2">
            Verificar Identidad
        </button>
    </form>

    <div class="text-center mt-3">
        <button id="btn-reenviar" class="btn btn-link btn-sm text-decoration-none text-secondary">¿No recibiste el correo? Solicitar otro</button>
    </div>
</div>

<script type="module" src="js/app.js"></script>
<script type="module" src="js/verificar.js"></script>
</body>
</html>

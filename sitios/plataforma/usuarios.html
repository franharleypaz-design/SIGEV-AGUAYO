<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - SIGEV Aguayo</title>
    <link class="tenant-branding" rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/sidebar.css">
    <link rel="stylesheet" href="css/solicitudes.css">
    <link rel="stylesheet" href="css/usuarios.css"> 
    <link rel="stylesheet" href="css/mobile.css">
    
    <script type="module">
        import { inyectarEstructuraGlobal } from "./js/layout.js";
        inyectarEstructuraGlobal();
    </script>
    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/seguridad.js?v=1"></script>
    <script type="module" src="js/usuarios.js" defer></script>
</head>
<body>

    <div id="app-workspace" class="app-container" style="display: none;">
        
        <div id="sidebar-container"></div>

        <main class="main-content">
            <div id="topbar-container"></div>

            <div class="dashboard-body">
                <div style="margin-bottom: 4px;">
                    <h2 style="font-size: 20px; font-weight: 700; color: var(--text-dark);">Gestión de Usuarios</h2>
                    <p style="font-size: 13px; color: var(--text-light); margin-top: 2px;">Control de accesos, roles gubernamentales y permisos del equipo territorial</p>
                </div>

                <div id="user-tabs-container" style="display: flex; gap: 24px; border-bottom: 1px solid #e2e8f0; margin-top: 16px; margin-bottom: 20px; padding: 0 4px; overflow-x: auto; white-space: nowrap;">
                    <div class="user-tab active" data-estado="Activo" style="padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 700; color: #0b438c; border-bottom: 2px solid #0b438c; transition: all 0.2s; user-select: none;">
                        🟢 Usuarios Activos
                    </div>
                    <div class="user-tab" data-estado="Inactivo" style="padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; transition: all 0.2s; user-select: none;">
                        📁 Usuarios Inactivos
                    </div>
                    <div class="user-tab" data-estado="Todos" style="padding: 12px 16px; cursor: pointer; font-size: 14px; font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; transition: all 0.2s; user-select: none;">
                        👥 Todos los Registros
                    </div>
                </div>
                
                <section class="filter-panel-card">
                    <div class="filter-mobile-header-row" style="display: none; width: 100%;">
                        <button id="btn-toggle-filters-mobile" style="width: 100%; background: #f1f5f9; border: 1px solid #cbd5e1; padding: 10px 14px; border-radius: 6px; font-weight: 700; color: #1e293b; display: flex; justify-content: space-between; align-items: center; cursor: pointer; font-size: 13.5px;">
                            <span>⚙️ FILTRAR EQUIPO</span>
                            <span class="filter-arrow" style="transition: transform 0.2s; display: inline-block;">▼</span>
                        </button>
                    </div>

                    <div class="filter-layout-row" style="display: grid; grid-template-columns: 2fr 1fr auto; gap: 16px; width: 100%; align-items: flex-end;">
                        <div class="filter-control" style="display: flex; flex-direction: column;">
                            <label style="font-weight: 700; margin-bottom: 6px; color: #475569; font-size: 12.5px;">Buscar por Nombre o Correo</label>
                            <input type="text" id="filter-personal-search" placeholder="Escribe el nombre o correo del funcionario..." style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13.5px; font-weight: 500; outline: none; box-sizing: border-box;">
                        </div>
                        <div class="filter-control" style="display: flex; flex-direction: column;">
                            <label style="font-weight: 700; margin-bottom: 6px; color: #475569; font-size: 12.5px;">Rol de Sistema</label>
                            <select id="filter-rol" style="width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13.5px; font-weight: 600; color: #1e293b; background-color: #fff; outline: none; box-sizing: border-box; height: 41px;">
                                <option value="Todos">Todos los roles</option>
                                <option value="SUPER_ADMIN">SUPER_ADMIN (Root)</option>
                                <option value="ADMIN">ADMIN</option>
                                <option value="GESTOR_TERRITORIAL">GESTOR_TERRITORIAL</option>
                                <option value="pendiente">Pendiente de Aprobación</option>
                                <option value="Inactivo">Inactivo (Acceso Revocado)</option>
                            </select>
                        </div>
                        <div class="filter-control speed-clear-box" style="height: 41px;">
                            <button id="btn-reset-filters" class="btn btn-secondary" style="height: 100%; padding: 0 24px; font-weight: 700; border-radius: 6px; border: 1px solid #cbd5e1; background: #f8fafc; color: #475569; cursor: pointer; transition: all 0.2s;" onmouseover="this.style.background='#cbd5e1'" onmouseout="this.style.background='#f8fafc'">Limpiar</button>
                        </div>
                    </div>
                </section>

                <section class="section-card" style="padding: 0; overflow: hidden; margin-top: 24px;">
                    <div class="action-bar" style="padding: 16px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; background: #fff;">
                        <div class="table-info">
                            <span id="pagination-info-text" class="text-sm" style="color: var(--text-light); font-weight: 600;">Cargando funcionarios...</span>
                        </div>
                        <div class="table-actions" style="display: flex; gap: 12px; align-items: center;">
                            <select id="user-limit-entries" class="limit-selector" style="padding: 8px; border: 1px solid var(--border-color); border-radius: 6px; outline: none; display: none;">
                                <option value="10">10 Filas</option>
                            </select>
                            <div class="pagination-controls-buttons" style="display: flex; gap: 8px; display: none;">
                                <button id="user-pag-prev" class="btn btn-secondary" style="padding: 6px 12px;">←</button>
                                <button id="user-pag-next" class="btn btn-secondary" style="padding: 6px 12px;">→</button>
                            </div>
                            </div>
                    </div>

                    <div class="table-responsive">
                        <table class="data-table" id="tabla-global-usuarios" style="width: 100%; border-collapse: collapse;">
                            <thead>
                                <tr>
                                    <th style="padding: 12px 16px; text-align: left; font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 800; min-width: 200px;">PERFIL DE MIEMBRO</th>
                                    <th style="padding: 12px 16px; text-align: left; font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 800; min-width: 220px;">CORREO ELECTRÓNICO</th>
                                    <th style="padding: 12px 16px; text-align: left; font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 800; min-width: 160px;">RANGO EN WORKSPACE</th>
                                    <th style="padding: 12px 16px; text-align: center; font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 800; width: 110px;">ESTADO</th>
                                    <th style="padding: 12px 16px; text-align: center; font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 800; width: 130px;">ÚLT. ACCESO (LOGIN)</th>
                                    <th style="padding: 12px 16px; text-align: center; font-size: 11px; text-transform: uppercase; color: #475569; font-weight: 800; width: 100px;">ACCIONES</th>
                                </tr>
                            </thead>
                            <tbody>
                                </tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

</body>
</html>
